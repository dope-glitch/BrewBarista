<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Owner - Register Your Café</title>
  <link rel="stylesheet" href="owner.css">
</head>
<body>
  <form id="ownerForm">
    <h2>Register Your Café</h2>

    <div>
      <label for="cafeName">Café Name</label>
      <input id="cafeName" type="text" required placeholder="Enter your café name">
    </div>

    <div>
      <label for="ownerName">Owner Name</label>
      <input id="ownerName" type="text" required placeholder="Enter your name">
    </div>

    <div>
      <label for="phone">Phone</label>
      <input id="phone" type="tel" required placeholder="Enter your phone number">
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="Enter your email">
    </div>

    <div>
      <label for="location">Location</label>
      <input id="location" type="text" required placeholder="Enter café location">
    </div>

    <div>
      <label for="pin">PIN Code</label>
      <input id="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter PIN code">
    </div>

    <div>
      <button type="submit">Submit</button>
    </div>
  </form>

  <script src="owner.js"></script>
</body>
</html>
