<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer - Book Your Table</title>
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <form id="customerForm">
    <h2>Book Your Table</h2>

    <div>
      <label for="name">Name</label>
      <input id="name" type="text" required placeholder="Enter your name">
    </div>

    <div>
      <label for="age">Age</label>
      <input id="age" type="number" min="1" required placeholder="Enter your age">
    </div>

    <div>
      <label for="phone">Phone</label>
      <input id="phone" type="tel" required placeholder="Enter your phone number">
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="Enter your email">
    </div>

    <div>
      <label for="guests">Number of Guests</label>
      <input id="guests" type="number" min="1" required placeholder="Enter number of guests">
    </div>

    <div>
      <button type="submit">Submit</button>
    </div>
  </form>

  <script src="customer.js"></script>
</body>
</html>
