<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BrewBarista</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <h2>Welcome to BrewBarista</h2>

    <!-- Role Options -->
    <div class="options">
      <a href="customer.html" class="role-btn customer">I’m a Customer</a>
      <a href="owner.html" class="role-btn owner">I’m a Café Owner</a>
    </div>

    <!-- Already a user section -->
    <div class="already-user">
      <p>Already a user?</p>
      <form id="loginForm">
        <div>
          <label for="username">Username</label>
          <input id="username" type="text" required placeholder="Enter your username">
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required placeholder="Enter your password">
        </div>

        <div>
          <button type="submit">Login</button>
        </div>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
